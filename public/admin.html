<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axonica 2.0 | Tablet Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">

  <!-- PIN Lock -->
  <div id="loginBox" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 p-8 rounded-3xl border border-slate-800 w-full max-w-sm text-center space-y-4 shadow-2xl">
      <div class="text-xs font-bold text-fuchsia-400 uppercase tracking-widest">GMC Seoni</div>
      <h1 class="text-2xl font-black text-white">AXONICA 2.0 ADMIN</h1>
      <input id="pinInput" type="password" inputmode="numeric" placeholder="Admin PIN (1234)"
        class="w-full text-center text-2xl tracking-widest bg-slate-800 border border-slate-700 rounded-xl py-3 focus:outline-none focus:border-fuchsia-500">
      <button onclick="login()" class="w-full bg-fuchsia-600 hover:bg-fuchsia-500 py-3.5 rounded-xl font-bold text-lg">
        Unlock Tablet Panel
      </button>
      <p id="loginErr" class="text-red-400 text-sm"></p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="hidden max-w-7xl mx-auto p-4 md:p-6 space-y-6">
    <header class="flex flex-wrap justify-between items-center gap-4 bg-slate-900 p-4 rounded-2xl border border-slate-800">
      <div>
        <h1 class="text-2xl font-black text-fuchsia-400">AXONICA 2.0 CONTROL</h1>
        <p class="text-xs text-slate-400">GMC Seoni • Live Tablet Dashboard</p>
      </div>
      <div class="flex gap-3">
        <button onclick="loadAdminData()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2.5 rounded-xl font-bold text-sm">Refresh</button>
        <a href="/" target="_blank" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2.5 rounded-xl font-bold text-sm">Student Site</a>
      </div>
    </header>

    <!-- Row 1: Notice & Leaderboard -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <section class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
        <h2 class="text-lg font-bold text-fuchsia-400">1. Live Notice Bar</h2>
        <textarea id="noticeInput" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 focus:outline-none focus:border-fuchsia-500"></textarea>
        <button onclick="updateNotice()" class="w-full bg-fuchsia-600 hover:bg-fuchsia-500 py-3 rounded-xl font-bold">
          Publish Live Notice
        </button>

        <div class="pt-4 border-t border-slate-800 space-y-3">
          <h3 class="text-sm font-bold text-cyan-400">Committees / Disciplines</h3>
          <div class="flex gap-2">
            <input id="newCommittee" placeholder="Nayi Committee (e.g. E-Sports)" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm">
            <button onclick="addCommittee()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-xl font-bold text-sm">+ Add</button>
          </div>
          <div id="committeeTags" class="flex flex-wrap gap-2"></div>
        </div>
      </section>

      <section class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
        <h2 class="text-lg font-bold text-amber-400">2. Batch Points Table</h2>
        <div id="adminLeaderboard" class="space-y-3"></div>
      </section>
    </div>

    <!-- Row 2: Event Manager -->
    <section class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
      <h2 class="text-lg font-bold text-emerald-400">3. Events & Coordinator Manager</h2>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-3 bg-slate-800/60 p-4 rounded-xl">
        <input id="evName" placeholder="Event Name *" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm">
        <select id="evComm" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm"></select>
        <select id="evDay" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm">
          <option>Day 1</option><option>Day 2</option><option>Day 3</option><option>Day 4</option>
          <option>Day 5</option><option>Day 6</option><option>Day 7</option><option>Day 8</option>
        </select>
        <input id="evTime" placeholder="Time (e.g. 10:00 AM) *" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm">
        <input id="evVenue" placeholder="Venue *" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm">
        <select id="evEntry" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm">
          <option value="Batch-wise">Batch-wise</option>
          <option value="Open">Open for All</option>
        </select>
        <select id="evReg" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm">
          <option value="Solo">Solo Registration</option>
          <option value="Team">Team Registration</option>
        </select>
        <input id="evCoordName" placeholder="Coordinator Name (Optional)" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm">
        <input id="evCoordPhone" placeholder="Coordinator WhatsApp (Optional)" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm">
        <input id="evRules" placeholder="Short Rules (Optional)" class="md:col-span-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-sm">
        <button onclick="addEvent()" class="bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold py-2.5 text-sm">+ Add Event</button>
      </div>

      <div id="adminEvents" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- Row 3: Registrations + CSV -->
    <section class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-3">
        <h2 class="text-lg font-bold text-sky-400">4. Registrations (<span id="regCount">0</span>)</h2>
        <div class="flex gap-2">
          <select id="regFilter" onchange="renderRegistrations()" class="bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm">
            <option value="All">All Events</option>
          </select>
          <button onclick="downloadCSV()" class="bg-sky-600 hover:bg-sky-500 px-4 py-2 rounded-xl font-bold text-sm">Download CSV</button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase">
              <th class="py-2 px-3">Name / Captain</th>
              <th class="py-2 px-3">Batch</th>
              <th class="py-2 px-3">Event</th>
              <th class="py-2 px-3">Team / Members</th>
              <th class="py-2 px-3">Phone</th>
              <th class="py-2 px-3">Time</th>
            </tr>
          </thead>
          <tbody id="regTable" class="divide-y divide-slate-800 text-sm"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    let ADMIN_PIN = '';
    let adminData = { committees: [], leaderboard: [], events: [], registrations: [] };
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    async function api(url, method = 'GET', body = null) {
      const opts = { method, headers: { 'Content-Type': 'application/json', 'x-admin-pin': ADMIN_PIN } };
      if (body) opts.body = JSON.stringify(body);
      return fetch(url, opts);
    }

    async function login() {
      ADMIN_PIN = document.getElementById('pinInput').value.trim();
      const res = await api('/api/admin/verify', 'POST');
      if (res.ok) {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadAdminData();
      } else {
        document.getElementById('loginErr').textContent = 'Galat PIN! Dobara try karein.';
      }
    }

    async function loadAdminData() {
      const res = await api('/api/admin/all');
      adminData = await res.json();

      document.getElementById('noticeInput').value = adminData.notice;

      // Committees
      document.getElementById('committeeTags').innerHTML = adminData.committees.map(c => `
        <span class="bg-slate-800 border border-slate-700 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-2">
          ${esc(c)}
          <button onclick="deleteCommittee('${esc(c)}')" class="text-red-400 hover:text-red-300">×</button>
        </span>
      `).join('');
      document.getElementById('evComm').innerHTML = adminData.committees.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');

      // Leaderboard
      document.getElementById('adminLeaderboard').innerHTML = adminData.leaderboard.map(t => `
        <div class="flex items-center justify-between bg-slate-800 p-3.5 rounded-xl">
          <div>
            <div class="font-bold">${esc(t.name)}</div>
            <div class="text-xl font-black text-amber-400">${t.points} pts</div>
          </div>
          <div class="flex gap-2">
            <button onclick="changePoints(${t.id}, -5)" class="bg-red-600/80 hover:bg-red-500 px-3.5 py-2 rounded-lg font-bold">-5</button>
            <button onclick="changePoints(${t.id}, 5)" class="bg-emerald-600/80 hover:bg-emerald-500 px-3.5 py-2 rounded-lg font-bold">+5</button>
            <button onclick="changePoints(${t.id}, 10)" class="bg-indigo-600 hover:bg-indigo-500 px-3.5 py-2 rounded-lg font-bold">+10</button>
          </div>
        </div>
      `).join('');

      // Events
      document.getElementById('adminEvents').innerHTML = adminData.events.map(e => `
        <div class="bg-slate-800 p-4 rounded-xl space-y-3 border border-slate-700">
          <div class="flex justify-between items-start gap-2">
            <div>
              <span class="text-xs text-fuchsia-400 font-bold uppercase">${esc(e.committee)} • ${esc(e.day)} • ${esc(e.entryType)} (${esc(e.regType)})</span>
              <h3 class="font-bold text-lg">${esc(e.name)}</h3>
              <p class="text-xs text-slate-400">${esc(e.time)} • ${esc(e.venue)}</p>
              <p class="text-xs text-emerald-400 mt-1">Coord: ${e.coordinatorName ? esc(e.coordinatorName) + ' (' + esc(e.coordinatorPhone) + ')' : 'TBA'}</p>
            </div>
            <div class="flex flex-col gap-1.5">
              <button onclick="editCoordinator(${e.id}, '${esc(e.coordinatorName)}', '${esc(e.coordinatorPhone)}')" class="text-cyan-400 bg-cyan-500/10 px-2.5 py-1 rounded text-xs font-bold">Edit Coord</button>
              <button onclick="deleteEvent(${e.id})" class="text-red-400 bg-red-500/10 px-2.5 py-1 rounded text-xs font-bold">Delete</button>
            </div>
          </div>
          <div class="grid grid-cols-3 gap-2">
            ${['Upcoming', 'Live', 'Completed'].map(st => `
              <button onclick="setStatus(${e.id}, '${st}')"
                class="py-2 rounded-lg text-xs font-bold transition ${e.status === st ? 'bg-fuchsia-600 text-white' : 'bg-slate-700 text-slate-300'}">
                ${st}
              </button>
            `).join('')}
          </div>
        </div>
      `).join('');

      // Reg filter dropdown
      const rf = document.getElementById('regFilter');
      const prevF = rf.value;
      const uniqueEvents = [...new Set(adminData.registrations.map(r => r.eventName))];
      rf.innerHTML = '<option value="All">All Events</option>' + uniqueEvents.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
      rf.value = prevF || 'All';
      renderRegistrations();
    }

    function renderRegistrations() {
      const filter = document.getElementById('regFilter').value;
      const list = filter === 'All' ? adminData.registrations : adminData.registrations.filter(r => r.eventName === filter);
      document.getElementById('regCount').textContent = list.length;
      document.getElementById('regTable').innerHTML = list.map(r => `
        <tr class="hover:bg-slate-800/50">
          <td class="py-2.5 px-3 font-medium">${esc(r.name)}</td>
          <td class="py-2.5 px-3 text-slate-300">${esc(r.batch)}</td>
          <td class="py-2.5 px-3 text-fuchsia-400 font-medium">${esc(r.eventName)}</td>
          <td class="py-2.5 px-3 text-xs text-slate-300">${r.teamName ? '<b>' + esc(r.teamName) + '</b><br>' + esc(r.members) : 'Solo'}</td>
          <td class="py-2.5 px-3"><a href="tel:${esc(r.phone)}" class="text-emerald-400 underline">${esc(r.phone)}</a></td>
          <td class="py-2.5 px-3 text-slate-400 text-xs">${esc(r.time)}</td>
        </tr>
      `).join('') || '<tr><td colspan="6" class="py-4 text-center text-slate-500">Koi registration nahi mila.</td></tr>';
    }

    function downloadCSV() {
      const filter = document.getElementById('regFilter').value;
      const list = filter === 'All' ? adminData.registrations : adminData.registrations.filter(r => r.eventName === filter);
      if (!list.length) return alert('Download karne ke liye koi data nahi hai.');
      const csvEsc = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      const headers = ['Name', 'Batch', 'Event', 'Type', 'Team Name', 'Members', 'Phone', 'Time'];
      const rows = list.map(r => [r.name, r.batch, r.eventName, r.regType, r.teamName, r.members, r.phone, r.time].map(csvEsc).join(','));
      const blob = new Blob([[headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `axonica2-${filter.toLowerCase().replace(/\s+/g, '-')}.csv`;
      a.click();
    }

    async function updateNotice() {
      await api('/api/admin/notice', 'POST', { notice: document.getElementById('noticeInput').value });
      alert('Notice update ho gaya!');
    }

    async function addCommittee() {
      const name = document.getElementById('newCommittee').value.trim();
      if (!name) return;
      await api('/api/admin/committee', 'POST', { name });
      document.getElementById('newCommittee').value = '';
      loadAdminData();
    }

    async function deleteCommittee(name) {
      if (!confirm(`Committee "${name}" delete karein?`)) return;
      await api(`/api/admin/committee/${encodeURIComponent(name)}`, 'DELETE');
      loadAdminData();
    }

    async function changePoints(id, delta) {
      await api('/api/admin/points', 'POST', { id, delta });
      loadAdminData();
    }

    async function addEvent() {
      const name = document.getElementById('evName').value.trim();
      const time = document.getElementById('evTime').value.trim();
      const venue = document.getElementById('evVenue').value.trim();
      if (!name || !time || !venue) return alert('Event Name, Time aur Venue zaroori hai.');
      await api('/api/admin/event', 'POST', {
        name,
        committee: document.getElementById('evComm').value,
        day: document.getElementById('evDay').value,
        time,
        venue,
        entryType: document.getElementById('evEntry').value,
        regType: document.getElementById('evReg').value,
        coordinatorName: document.getElementById('evCoordName').value,
        coordinatorPhone: document.getElementById('evCoordPhone').value,
        rules: document.getElementById('evRules').value
      });
      ['evName', 'evTime', 'evVenue', 'evCoordName', 'evCoordPhone', 'evRules'].forEach(id => document.getElementById(id).value = '');
      loadAdminData();
    }

    async function editCoordinator(id, oldName, oldPhone) {
      const coordinatorName = prompt('Coordinator ka naam:', oldName || '');
      if (coordinatorName === null) return;
      const coordinatorPhone = prompt('Coordinator ka 10-digit WhatsApp number:', oldPhone || '');
      if (coordinatorPhone === null) return;
      await api(`/api/admin/event/${id}`, 'PUT', { coordinatorName, coordinatorPhone });
      loadAdminData();
    }

    async function setStatus(id, status) {
      await api(`/api/admin/event/${id}`, 'PUT', { status });
      loadAdminData();
    }

    async function deleteEvent(id) {
      if (!confirm('Event delete karna hai?')) return;
      await api(`/api/admin/event/${id}`, 'DELETE');
      loadAdminData();
    }
  </script>
</body>
</html>
